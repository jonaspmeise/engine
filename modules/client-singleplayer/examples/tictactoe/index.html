<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --board-bg: #1e293b;
        --slot-bg: #334155;
        --text-main: #f8fafc;
        --color-x: #38bdf8; /* Cyan-blue */
        --color-o: #fb7185; /* Rose-pink */
        --border-radius: 12px;
        --gap: 8px;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      main {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
      }

      h1 {
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      /* The Board Container */
      #tic-tac-toe-target {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        background-color: var(--board-bg);
        padding: var(--gap);
        border-radius: var(--border-radius);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.3),
          0 10px 10px -5px rgba(0, 0, 0, 0.1);
        aspect-ratio: 1 / 1; /* Keeps the board square */
        width: 100%;
      }

      /* Row Styling */
      .lane.horizontal-lane {
        display: flex;
        flex: 1; /* Ensures rows are equal height */
        gap: var(--gap);
      }

      /* Individual Slot Styling */
      .slot {
        flex: 1; /* Ensures slots are equal width */
        background-color: var(--slot-bg);
        border-radius: calc(var(--border-radius) / 2);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;

        /* Text Styling */
        font-size: clamp(2rem, 10vw, 4rem);
        font-weight: 800;
        transition: all 0.2s ease;
        user-select: none;
      }

      /* Player Specific Colors */
      .slot.player-X {
        color: var(--color-x);
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      }

      .slot.player-O {
        color: var(--color-o);
        text-shadow: 0 0 15px rgba(251, 113, 133, 0.4);
      }

      .slot.highlighted {
        outline: 2px solid yellow;
      }

      .slot.highlighted:hover {
        outline: 2px solid orange;
      }

      .slot.highlighted:active {
        transform: scale(0.95);
      }

      /* Hide the empty #board div if it's unused */
      #board {
        display: none;
      }

      /* ===== Result Overlay ===== */
      #result-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        cursor: pointer;
      }

      #result-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      #result-overlay.visible {
        display: flex;
      }

      #result-text {
        font-size: clamp(3.5rem, 14vw, 8rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.1;
        padding: 0 1rem;
        animation: result-appear 0.65s cubic-bezier(0.34, 1.56, 0.64, 1)
          forwards;
      }

      .result-win #result-text {
        color: #fbbf24;
        text-shadow:
          0 0 40px rgba(251, 191, 36, 0.8),
          0 0 80px rgba(251, 191, 36, 0.4);
      }

      .result-lose #result-text {
        color: #f87171;
        text-shadow:
          0 0 40px rgba(248, 113, 113, 0.8),
          0 0 80px rgba(248, 113, 113, 0.4);
      }

      .result-draw #result-text {
        color: #94a3b8;
        text-shadow:
          0 0 40px rgba(148, 163, 184, 0.7),
          0 0 80px rgba(148, 163, 184, 0.3);
      }

      @keyframes result-appear {
        0% {
          transform: scale(0.05);
          opacity: 0;
        }
        65% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ===== Fireworks ===== */
      .firework-burst {
        position: fixed;
        pointer-events: none;
        z-index: 1001;
        width: 0;
        height: 0;
      }

      .firework-particle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transform-origin: center;
        animation: fw-fly var(--dur, 0.9s) ease-out forwards;
      }

      @keyframes fw-fly {
        0% {
          transform: translate(0, 0) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0.1);
          opacity: 0;
        }
      }

      /* ===== Play Again / Cancel Buttons ===== */
      #result-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      #play-again,
      #cancel-btn {
        padding: 0.65rem 2rem;
        border: 2px solid currentColor;
        border-radius: 9999px;
        background: transparent;
        font-family: inherit;
        font-size: clamp(1rem, 3vw, 1.4rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        opacity: 0;
        animation: result-appear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s
          forwards;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .result-win #play-again,
      .result-win #cancel-btn {
        color: #fbbf24;
      }

      .result-win #play-again:hover,
      .result-win #cancel-btn:hover {
        background: #fbbf24;
        color: #0f172a;
      }

      .result-lose #play-again,
      .result-lose #cancel-btn {
        color: #f87171;
      }

      .result-lose #play-again:hover,
      .result-lose #cancel-btn:hover {
        background: #f87171;
        color: #0f172a;
      }

      .result-draw #play-again,
      .result-draw #cancel-btn {
        color: #94a3b8;
      }

      .result-draw #play-again:hover,
      .result-draw #cancel-btn:hover {
        background: #94a3b8;
        color: #0f172a;
      }
    </style>

    <script type="module" src="./tictactoe.ts"></script>
  </head>
  <body>
    <main>
      <h1>Tic-Tac-Toe</h1>

      <div id="tic-tac-toe-target">
        <!-- Injected by client script -->
      </div>
    </main>

    <div id="result-overlay">
      <div id="result-content">
        <span id="result-text"></span>
        <div id="result-buttons">
          <button id="play-again">Play Again?</button>
          <button id="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
  </body>
</html>
