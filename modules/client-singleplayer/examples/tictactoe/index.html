<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --board-bg: #1e293b;
        --slot-bg: #334155;
        --text-main: #f8fafc;
        --color-x: #38bdf8; /* Cyan-blue */
        --color-o: #fb7185; /* Rose-pink */
        --border-radius: 12px;
        --gap: 8px;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      main {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
      }

      h1 {
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      /* The Board Container */
      #tic-tac-toe-target {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        background-color: var(--board-bg);
        padding: var(--gap);
        border-radius: var(--border-radius);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.3),
          0 10px 10px -5px rgba(0, 0, 0, 0.1);
        aspect-ratio: 1 / 1; /* Keeps the board square */
        width: 100%;
      }

      /* Row Styling */
      .lane.horizontal-lane {
        display: flex;
        flex: 1; /* Ensures rows are equal height */
        gap: var(--gap);
      }

      /* Individual Slot Styling */
      .slot {
        flex: 1; /* Ensures slots are equal width */
        background-color: var(--slot-bg);
        border-radius: calc(var(--border-radius) / 2);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;

        /* Text Styling */
        font-size: clamp(2rem, 10vw, 4rem);
        font-weight: 800;
        transition: all 0.2s ease;
        user-select: none;
      }

      /* Player Specific Colors */
      .slot.player-X {
        color: var(--color-x);
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      }

      .slot.player-O {
        color: var(--color-o);
        text-shadow: 0 0 15px rgba(251, 113, 133, 0.4);
      }

      /* Hide the empty #board div if it's unused */
      #board {
        display: none;
      }
    </style>

    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main>
      <h1>Tic-Tac-Toe</h1>

      <div id="tic-tac-toe-target">
        <!-- Injected by client script -->
      </div>
    </main>
  </body>
</html>
